{% extends "base.html" %}
{% block title %}Delete Dataset | TakwimuBridge{% endblock %}

{% block content %}
<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="form-card">
<h1 class="h4">Delete "{{ object.title }}"?</h1>
<p class="text-muted">This will permanently remove the dataset and its file. This can't be undone.</p>
<form method="post">
{% csrf_token %}
<button type="submit" class="btn btn-danger">Yes, Delete</button>
<a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
</div>
</div>
</div>
{% endblock %}
